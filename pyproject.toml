[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fapiaozone-sdk"
version = "0.1.0"
description = "Python SDK for Kingdee Piaozone Ultimate direct electronic invoicing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Qingdao Ohm Network Technology Co., Ltd.", email = "kevin@odoomommy.com"}]
dependencies = ["requests>=2.31,<3", "cryptography>=41", "simplejson>=3.19"]

[project.urls]
Repository = "https://github.com/jellyfrank/fapiaozone-sdk"
Documentation = "https://open-ultimate.piaozone.com/"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["piaozone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
